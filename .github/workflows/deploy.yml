name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    # This site is served from the repo root on Vercel (www.meihodo.com) and
    # from /test/ on GitHub Pages, so the root-absolute paths committed to the
    # repo - which are what Vercel needs, per CLAUDE.md deployment invariant 2 -
    # are rewritten onto the Pages base path here, in the throwaway CI checkout,
    # and never committed. base_path comes from configure-pages, so renaming the
    # repo or attaching a custom domain needs no change here.
    #
    # canonical, hreflang, og:*, twitter:* and the JSON-LD keep pointing at
    # https://www.meihodo.com/ : Pages is a mirror, not the canonical home.
    - name: Rewrite internal paths for the Pages base path
      run: |
        python3 scripts/build_pages_base.py --base "${{ steps.pages.outputs.base_path }}"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

# Permissions needed for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
